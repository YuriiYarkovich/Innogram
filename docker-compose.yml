services:
  postgres:
    image: postgres:15-alpine
    container_name: innogram-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: innogram-minio
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network
    restart: unless-stopped

  core_microservice:
    build:
      context: ./apps/core_microservice
      dockerfile: Dockerfile
    container_name: core_microservice
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CORE_SERVICE_PORT: ${CORE_SERVICE_PORT:-3001}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      AUTH_SERVICE_URL: http://auth_microservice:${AUTH_SERVICE_PORT:-3002}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_URL: ${S3_PUBLIC_URL:-http://localhost}
      S3_BUCKET: ${S3_BUCKET:-innogram-files}
    expose:
      - "${CORE_SERVICE_PORT:-3001}"
      - "3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(process.env.CORE_SERVICE_PORT || 3001, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - innogram-network
    restart: unless-stopped

  auth_microservice:
    build:
      context: ./apps/auth_microservice
      dockerfile: Dockerfile
    container_name: auth_microservice
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3002}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CORE_SERVICE_URL: http://core_microservice:${CORE_SERVICE_PORT:-3001}
      DOMAIN: ${DOMAIN:-localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-720m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-10080m}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}
    expose:
      - "${AUTH_SERVICE_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(process.env.AUTH_SERVICE_PORT || 3002, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - innogram-network
    restart: unless-stopped

  client_app:
    build:
      context: ./apps/client_app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_CHAT_SOCKET_SERVER_URL: ${NEXT_PUBLIC_CHAT_SOCKET_SERVER_URL:-http://localhost}
    container_name: client_app
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CORE_SERVICE_URL: http://core_microservice:${CORE_SERVICE_PORT:-3001}
      AUTH_SERVICE_URL: http://auth_microservice:${AUTH_SERVICE_PORT:-3002}
    expose:
      - "3000"
    depends_on:
      core_microservice:
        condition: service_healthy
      auth_microservice:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(3000, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - innogram-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: innogram-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      core_microservice:
        condition: service_healthy
      auth_microservice:
        condition: service_healthy
      client_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  innogram-network:
    driver: bridge
