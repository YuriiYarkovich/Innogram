events {
    worker_connections 1024;
}

http {
    upstream client_app {
        server client_app:3000;
    }

    upstream core_microservice {
        server core_microservice:3001;
    }

    upstream auth_microservice {
        server auth_microservice:3002;
    }

    # ДОБАВЛЕНО для Socket.IO
    upstream socket_io {
        server core_microservice:3004;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend (Next.js)
        location / {
            proxy_pass http://client_app;  # ИСПРАВЛЕНО
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Core Microservice API
        location /api/core {
            rewrite ^/api/core/(.*) /$1 break;  # Убираем /api/core из пути
            proxy_pass http://core_microservice;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth Microservice API
        location /api/auth {
            rewrite ^/api/auth/(.*) /$1 break;  # Убираем /api/auth из пути
            proxy_pass http://auth_microservice;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Socket.IO для чата - ДОБАВЛЕНО
        location /socket.io/ {
            proxy_pass http://socket_io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для долгих соединений
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            # Отключаем буферизацию для WebSocket
            proxy_buffering off;
        }
    }
}